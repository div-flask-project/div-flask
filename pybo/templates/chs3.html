<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="faq-container">
  <h2>자주 하는 질문 (FAQ)</h2>
  
  <!-- FAQ 아이템 1 -->
  <div class="faq-item">
    <button class="faq-question">
      <span>Q. 회원탈퇴는 어떻게 하나요?</span>
      <span class="faq-icon">+</span>
    </button>
    <div class="faq-answer">
      <p>마이페이지 > 회원정보 수정 메뉴 하단에서 '회원탈퇴'를 진행하실 수 있습니다. 탈퇴 시 모든 데이터는 즉시 삭제되며 복구가 불가능합니다.</p>
    </div>
  </div>

  <!-- FAQ 아이템 2 -->
  <div class="faq-item">
    <button class="faq-question">
      <span>Q. 배송 기간은 얼마나 걸리나요?</span>
      <span class="faq-icon">+</span>
    </button>
    <div class="faq-answer">
      <p>주문 완료 후 영업일 기준 평균 2~3일 정도 소요됩니다. 도서산간 지역은 1~2일 정도 추가될 수 있습니다.</p>
    </div>
  </div>

  <!-- FAQ 아이템 3 -->
  <div class="faq-item">
    <button class="faq-question">
      <span>Q. 환불 규정이 궁금합니다.</span>
      <span class="faq-icon">+</span>
    </button>
    <div class="faq-answer">
      <p>상품 수령 후 7일 이내에 고객센터나 1:1 문의를 통해 반품 신청이 가능합니다. 단, 상품이 훼손된 경우 반품이 어려울 수 있습니다.</p>
    </div>
  </div>
</div>
</body>
</html>
